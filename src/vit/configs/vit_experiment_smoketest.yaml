experiment_name: "vit_b16_morph_detection_smoketest"

data:
  train_csv: "datasets/split/train.csv"
  val_csv: "datasets/split/validation.csv"
  test_csv: "datasets/split/test.csv"
  image_root: "datasets"
  image_size: 224
  batch_size: 1
  num_workers: 0
  pin_memory: false
  label_column: "label"
  path_column: "image_id"
  drop_last_train: false

model:
  backbone: "vit_b_16"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.1

optimizer:
  name: "adamw"
  lr: 0.00003
  weight_decay: 0.01
  betas: [0.9, 0.999]
  momentum: 0.9

scheduler:
  name: "cosine"
  warmup_epochs: 0
  total_epochs: 2
  min_lr: 0.0000001
  step_size: 10
  gamma: 0.1
  plateau_patience: 3
  plateau_factor: 0.5

training:
  epochs: 2
  loss_name: "cross_entropy"
  use_class_weights: false
  mixed_precision: false
  grad_clip_norm: 1.0
  early_stopping_patience: 100
  early_stopping_metric: "val_loss"
  early_stopping_mode: "min"
  seed: 42
  checkpoint_dir: "outputs/Checkpoints"
  log_dir: "outputs/logs"
  results_dir: "outputs/results"
  device: "auto"
  log_every_n_steps: 1