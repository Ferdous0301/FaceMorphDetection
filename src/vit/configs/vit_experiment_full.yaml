experiment_name: "vit_b16_morph_detection_full_run"

data:
  train_csv: "datasets/split/train.csv"
  val_csv: "datasets/split/validation.csv"
  test_csv: "datasets/split/test.csv"
  image_root: "datasets"              # was "data/aligned" — corrected
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  label_column: "label"
  path_column: "image_id"             # was "image_path" — corrected
  drop_last_train: false

model:
  backbone: "vit_b_16"
  pretrained: true
  num_classes: 2
  freeze_backbone: false
  dropout: 0.1

optimizer:
  name: "adamw"
  lr: 0.00003
  weight_decay: 0.01
  betas: [0.9, 0.999]
  momentum: 0.9

scheduler:
  name: "cosine"
  warmup_epochs: 2
  total_epochs: 30
  min_lr: 0.0000001
  step_size: 10
  gamma: 0.1
  plateau_patience: 3
  plateau_factor: 0.5

training:
  epochs: 30
  loss_name: "cross_entropy"
  use_class_weights: true
  mixed_precision: true               # fine now — GPU available
  grad_clip_norm: 1.0
  early_stopping_patience: 5
  early_stopping_metric: "val_eer"
  early_stopping_mode: "min"
  seed: 42
  checkpoint_dir: "outputs/Checkpoints"
  log_dir: "outputs/logs"
  results_dir: "outputs/results"
  device: "auto"
  log_every_n_steps: 50